[tool.quality_gate]
python_observed = "3.12.13"
ruff = "0.16.1"
type_checker = "mypy==2.3.0"
pytest = "9.1.1"
pytest_cov = "7.1.0"
manifest_scope_registry = "scripts/quality_gate/trusted_scopes.json"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/autotrade/market_data"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests/market_data"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src/autotrade/market_data"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
